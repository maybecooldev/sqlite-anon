[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-anon"
version = "0.1.0"
description = "Make an anonymised copy of a SQLite database without breaking its joins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "maybecooldev" }]
keywords = ["sqlite", "anonymisation", "gdpr", "lgpd", "privacy", "pseudonymisation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Security",
]
# No runtime dependencies: sqlite3, hmac, hashlib and secrets are all stdlib.
dependencies = []

[project.optional-dependencies]
compose = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
sqlite-anon = "sqlite_anon.cli:main"

[project.urls]
Homepage = "https://github.com/maybecooldev/sqlite-anon"
Issues = "https://github.com/maybecooldev/sqlite-anon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_anon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# S608 flags string-built SQL. Every identifier interpolated into a query here
# comes from the database's own sqlite_master and is passed through
# _quote(), which doubles any embedded quote. All *values* go through bound
# parameters. There is no path from user input into a query string.
"src/sqlite_anon/anonymize.py" = ["S608"]
"src/sqlite_anon/detect.py" = ["S608"]
"tests/test_anonymize.py" = ["S608"]
